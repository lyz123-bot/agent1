openapi: 3.0.3
info:
  title: AI Agent API
  description: |
    REST API for a Django‑based AI Agent platform.
    Provides authentication, LLM chat, image location, and vector‑database operations.
  version: 0.1.0
servers:
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User profile operations
  - name: Chat
    description: Large‑language‑model chat
  - name: Locator
    description: Image recognition & geographic location
  - name: VectorDB
    description: Vector‑database ingestion and query

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    TokenResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    RefreshResponse:
      type: object
      properties:
        access:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ChatResponse:
      type: object
      properties:
        answer:
          type: string
    LocatorResponse:
      type: object
      properties:
        filename:
          type: string
        predictions:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
    VDBUploadResponse:
      type: object
      properties:
        task_id:
          type: string
    VectorQueryResult:
      type: object
      properties:
        documents:
          type: array
          items:
            type: object
            properties:
              doc_id:
                type: string
              score:
                type: number
              snippet:
                type: string

security:
  - BearerAuth: []

paths:
  # Authentication -----------------------------------------------------------
  /accounts/token/:
    post:
      tags: [Auth]
      summary: Obtain JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Successful token generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials

  /accounts/token/refresh/:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Invalid refresh token

  # User profile -------------------------------------------------------------
  /accounts/me/:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # Chat --------------------------------------------------------------------
  /chat/:
    post:
      tags: [Chat]
      summary: Submit a chat prompt to the LLM
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Model answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  # Locator -----------------------------------------------------------------
  /locator/:
    post:
      tags: [Locator]
      summary: Upload an image for object/location detection
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Detection results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocatorResponse'

  # Vector DB ---------------------------------------------------------------
  /vdb/upload/:
    post:
      tags: [VectorDB]
      summary: Batch upload documents for vectorization (admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: Accepted; vectorization task enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VDBUploadResponse'

  /vdb/query/:
    get:
      tags: [VectorDB]
      summary: Query the vector database for relevant documents
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Query text
        - in: query
          name: top_k
          required: false
          schema:
            type: integer
            default: 5
          description: Number of top results to return
      responses:
        '200':
          description: Ranked matching documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorQueryResult'

